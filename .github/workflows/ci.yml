name: BANKdragon V2.1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  adr-governance:
    name: ADR governance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install adr-tools
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch 3.0.0 \
            https://github.com/npryce/adr-tools.git \
            /tmp/adr-tools

          echo "/tmp/adr-tools/src" >> "$GITHUB_PATH"

      - name: Validate ADR registry with adr-tools
        shell: bash
        run: |
          set -euo pipefail

          echo "ADR registry managed by adr-tools:"
          adr list

          mapfile -t ADR_FILES < <(adr list)

          if [ "${#ADR_FILES[@]}" -eq 0 ]; then
            echo "::error::adr-tools found no ADRs"
            exit 1
          fi

          for adr in "${ADR_FILES[@]}"; do
            echo "Validating $adr"

            for heading in \
              "## Status" \
              "## Context" \
              "## Decision" \
              "## Consequences"
            do
              if ! grep -Fqx "$heading" "$adr"; then
                echo "::error file=$adr::Missing required section: $heading"
                exit 1
              fi
            done

            if ! grep -Eq '^(Proposed|Accepted|Superseded)$' "$adr"; then
              echo "::error file=$adr::Invalid ADR status"
              exit 1
            fi
          done

      - name: Require ADR for architectural changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Files changed by this Pull Request:"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | tee /tmp/changed-files.txt

          if grep -Eq \
            '^(compose\.yaml|\.devcontainer/|docs/architecture/|observability/|services/[^/]+/(Dockerfile|src/main/resources/application\.yml))' \
            /tmp/changed-files.txt; then

            echo "Architectural change detected."

            if ! grep -Eq '^docs/adr/[0-9]{4}-.*\.md$' \
              /tmp/changed-files.txt; then

              echo "::error::Architectural changes require an ADR managed by adr-tools"
              exit 1
            fi

            echo "ADR evidence found."

          else

            echo "No architectural change detected; no new ADR required."

          fi

  architecture-contract:
    name: Architecture contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Required deployable services
        run: |
          set -euo pipefail

          for service in \
            payments-api \
            audit-api \
            experiences-api \
            travel-benefits-api \
            events-api \
            social-split-api
          do
            test -f "services/$service/Dockerfile"
            test -f "services/$service/pom.xml"
            test -f "services/$service/src/main/resources/application.yml"
          done

          test -f observability/compose.yaml
          test -f observability/prometheus.yml
          test -f observability/grafana/dashboards/bankpulse-overview.json
          test -f observability/grafana/dashboards/social-split-business-kpis.json

          test -f docs/architecture/DATA-OWNERSHIP.md

          test -f frontend/index.html
          test -f frontend/app.js
          test -f frontend/styles.css

          test -f scripts/business-gate-payment-idempotency.sh
          test -f scripts/business-kpi-social-split.sh

      - name: Validate compose models
        run: |
          docker compose config --quiet
          docker compose -f observability/compose.yaml config --quiet

  integration-test:
    name: Build, integration and observability
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - architecture-contract
      - adr-governance

    steps:
      - uses: actions/checkout@v4

      - name: Build and start BANKdragon V2
        run: |
          docker compose up \
            --build \
            -d \
            --wait \
            --wait-timeout 300

      - name: Validate interactive edge UI
        run: |
          curl -fsS http://localhost:8080/ \
            | grep -q "BANKdragon"

          curl -fsS http://localhost:8080/app.js \
            | grep -q "Seat HOLD created"

      - name: Business release gate - payment idempotency
        run: |
          bash scripts/business-gate-payment-idempotency.sh

      - name: Business KPI gate - Social Split
        run: |
          bash scripts/business-kpi-social-split.sh

      - name: Domain and regression smoke tests
        run: |
          bash scripts/smoke-v2.sh

      - name: Start Prometheus and Grafana
        run: |
          docker compose \
            -f observability/compose.yaml \
            up -d prometheus grafana

      - name: Validate observability endpoints
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9090/-/healthy \
              && break \
              || sleep 2
          done

          curl -fsS http://localhost:9090/-/healthy

          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health \
              && break \
              || sleep 2
          done

          curl -fsS http://localhost:3000/api/health \
            | grep -q '"database"'

      - name: Validate Social Split KPIs in Prometheus
        shell: bash
        run: |
          set -euo pipefail

          METRICS=(
            bankpulse_social_split_sessions_completed_total
            bankpulse_social_split_participants_authorized_total
            bankpulse_social_split_sessions_close_duration_seconds_count
            bankpulse_social_split_sessions_close_blocked_total
            bankpulse_social_split_settlements_valid_total
          )

          for metric in "${METRICS[@]}"; do

            echo "Checking $metric"

            FOUND=false

            for i in $(seq 1 30); do

              RESPONSE="$(
                curl -fsS \
                  "http://localhost:9090/api/v1/query?query=$metric" \
                  || true
              )"

              if echo "$RESPONSE" \
                | grep -q "$metric"; then

                FOUND=true
                break
              fi

              sleep 2
            done

            if [ "$FOUND" != "true" ]; then
              echo "::error::Prometheus did not scrape $metric"
              exit 1
            fi

            echo "$metric -> visible in Prometheus"

          done

      - name: Capture evidence on failure
        if: failure()
        run: |
          echo "======================================"
          echo " PLATFORM STATUS"
          echo "======================================"

          docker compose ps || true

          echo
          echo "======================================"
          echo " PLATFORM LOGS"
          echo "======================================"

          docker compose logs --tail=250 || true

          echo
          echo "======================================"
          echo " OBSERVABILITY STATUS"
          echo "======================================"

          docker compose \
            -f observability/compose.yaml \
            ps || true

          echo
          echo "======================================"
          echo " OBSERVABILITY LOGS"
          echo "======================================"

          docker compose \
            -f observability/compose.yaml \
            logs --tail=150 || true

      - name: Stop observability
        if: always()
        run: |
          docker compose \
            -f observability/compose.yaml \
            down -v || true

      - name: Stop platform
        if: always()
        run: |
          docker compose down -v || true